<h2 mat-dialog-title>{{data.title}}</h2>
<mat-dialog-content>
  <div  [innerHTML]="safeMessage"></div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onNo()">No</button>
  <button mat-raised-button color="primary" (click)="onYes()">Yes</button>
</mat-dialog-actions>
